<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b8d7ff" />
    <meta name="description" content="Step into Scalpless, a hands-on virtual dissection lab." />
    <title>Scalpless</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="./art/frog-landing-poster.webp" />
  </head>
  <body>
    <main class="scroll-story" aria-label="Scalpless. Scroll to enter the frog dissection lab.">
      <div class="story-stage">
        <div id="landing-scene" role="img" aria-label="A blue spotted frog in a luminous glass laboratory"></div>
        <div class="lab-reveal" inert aria-hidden="true">
          <iframe id="lab-frame" title="Interactive frog dissection lab" src="./lab.html?specimen=frog&amp;appearance=blue&amp;embed=landing" tabindex="-1" allow="camera 'self'"></iframe>
        </div>
        <div class="transition-light" aria-hidden="true"></div>
        <div class="model-loading" role="status" aria-label="Preparing the 3D laboratory"><i></i></div>
        <a class="enter-lab icon-control" href="./lab.html?specimen=frog&amp;appearance=blue" aria-label="Enter the frog dissection lab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
        </a>
        <button class="scroll-cue icon-control" type="button" aria-label="Scroll into the laboratory">
          <svg viewBox="0 0 24 32" aria-hidden="true"><rect x="6" y="1" width="12" height="20" rx="6"/><path d="M12 6v5m-5 15 5 5 5-5"/></svg>
        </button>
        <a class="return-home icon-control" href="./" aria-label="Return to the opening scene" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5m6-6-6 6 6 6"/></svg>
        </a>
        <div id="landing-status" class="sr-only" role="status" aria-live="polite"></div>
      </div>
    </main>
    <script type="module" src="./src/landing.js"></script>
  </body>
</html>
