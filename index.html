<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e7f0ff" />
    <meta name="description" content="Scalpless. A hands-on virtual dissection bench." />
    <title>Scalpless — Dissection bench</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip-link" href="#tools" aria-label="Skip to dissection tools"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></a>
    <main id="bench" class="bench" aria-label="Interactive onion dissection bench">
      <div id="scene" class="scene" tabindex="0" role="application" aria-label="3D dissection bench. V to inspect, S for scalpel, H for forceps. Right drag or arrow keys to orbit. Plus and minus to zoom."></div>
      <aside class="gesture-panel" aria-label="Hand tracking controls">
        <div class="gesture-actions"><button id="gesture-toggle" type="button" aria-pressed="false">Enable webcam</button></div>
        <p id="gesture-readout">Mouse / keyboard</p>
        <details><summary>Hand tracking setup</summary>
          <label>Camera position<select id="gesture-mode"><option value="flat">Flat on desk, lens facing up</option><option value="front">Facing you</option></select></label>
          <label>Camera rotation<select id="gesture-rotation"><option value="0">0°</option><option value="1">90°</option><option value="2">180°</option><option value="3">270°</option></select></label>
          <label>Movement sensitivity<input id="gesture-motion" type="range" min=".75" max="2.5" step=".05" value="1.5"><output id="gesture-motion-value">1.50×</output></label>
          <label class="gesture-check"><input id="gesture-show-hands" type="checkbox" checked> Show virtual hands</label>
          <button id="gesture-calibrate" type="button">Set neutral height</button>
          <div id="gesture-preview" hidden><video id="gesture-video" autoplay playsinline muted></video><canvas id="gesture-overlay"></canvas></div>
          <p id="gesture-feedback" role="status">Pinch to lift and peel. Extend only your index to cut the onion seam. Video stays on your device.</p>
        </details>
      </aside>
      <div class="context-controls" id="context-controls" hidden>
        <button id="piece-menu" class="icon-button" type="button" aria-label="Choose tissue" aria-expanded="false" aria-controls="piece-picker"></button>
        <select id="piece-select" class="sr-only" aria-label="Selected tissue"></select>
        <button id="primary-action" class="icon-button" type="button" aria-label="Lift section"></button>
        <button id="place-action" class="icon-button" type="button" aria-label="Place on bench" hidden></button>
        <div id="piece-picker" class="piece-picker" role="group" aria-label="Available tissue" hidden></div>
      </div>
      <div class="manipulation-pad" id="manipulation-pad" aria-label="Move held tissue" hidden></div>
      <footer class="controls-area">
        <div id="cut-progress" class="cut-progress" role="progressbar" aria-label="Incision coverage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
          <i id="cut-progress-fill"></i>
          <output id="cut-percentage" class="sr-only"></output>
        </div>
        <nav class="tool-strip" id="tools" aria-label="Dissection tools"></nav>
      </footer>
      <p id="tool-hint" class="sr-only"></p>
      <div id="status" class="sr-only" role="status" aria-live="polite"></div>
      <div class="loading" id="loading" role="status" aria-label="Preparing the bench"><span class="loading-orbit" aria-hidden="true"></span></div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
